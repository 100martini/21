[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname

[logger_alembic]
level = INFO
handlers = console
qualname = alembic


[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
